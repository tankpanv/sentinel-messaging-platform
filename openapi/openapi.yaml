openapi: 3.0.3
info:
  title: Sentinel Messaging Platform API
  version: 1.0.0
servers:
- url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
          required:
          - code
          - message
          - requestId
      required:
      - error
    AccessToken:
      type: object
      properties:
        accessToken:
          type: string
      required:
      - accessToken
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - username
      - password
    Account:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
          nullable: true
        status:
          type: string
        platformUserId:
          type: string
          nullable: true
        rateLimitedUntil:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - status
    TransitionRequest:
      type: object
      properties:
        to:
          type: string
        expectedFrom:
          type: string
      required:
      - to
      - expectedFrom
    CreateGroupRequest:
      type: object
      properties:
        creatorAccountId:
          type: string
        memberAccountIds:
          type: array
          items:
            type: string
      required:
      - creatorAccountId
      - memberAccountIds
    JobId:
      type: object
      properties:
        jobId:
          type: string
      required:
      - jobId
    RunId:
      type: object
      properties:
        runId:
          type: string
      required:
      - runId
    GroupMember:
      type: object
      properties:
        accountId:
          type: string
        platformUserId:
          type: string
        role:
          type: string
      required:
      - accountId
      - platformUserId
      - role
    GatewayGroupMember:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
          nullable: true
        platformUserId:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [creator, admin, member]
        managed:
          type: boolean
        status:
          type: string
          nullable: true
      required:
      - id
      - platformUserId
      - displayName
      - role
      - managed
    Group:
      type: object
      properties:
        id:
          type: string
        gatewayGroupId:
          type: string
        status:
          type: string
        creatorAccountId:
          type: string
        agentEnabled:
          type: boolean
        autoKickEnabled:
          type: boolean
        members:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'
        gatewayMembers:
          type: array
          description: Gateway 当前完整成员快照，包含平台托管账号和其他 Gateway 用户
          items:
            $ref: '#/components/schemas/GatewayGroupMember'
        gatewayMembersSynced:
          type: boolean
          description: 本次响应是否成功从 Gateway 读取当前成员
        activeSequenceRunId:
          type: string
          nullable: true
        activeAgentRunId:
          type: string
          nullable: true
      required:
      - id
      - status
    GroupPatch:
      type: object
      properties:
        agentEnabled:
          type: boolean
        autoKickEnabled:
          type: boolean
      required: &id001 []
    InviteResponse:
      type: object
      properties:
        inviteLink:
          type: string
        readyAfterMs:
          type: integer
      required:
      - inviteLink
      - readyAfterMs
    JoinRequest:
      type: object
      properties:
        accountId:
          type: string
        inviteLink:
          type: string
      required:
      - accountId
      - inviteLink
    JoinAccepted:
      type: object
      properties:
        accepted:
          type: boolean
      required:
      - accepted
    CreateJoinRequest:
      type: object
      properties:
        accountId:
          type: string
      required:
      - accountId
    GroupJoinRequest:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        accountId:
          type: string
        status:
          type: string
          enum: [pending, approved, joined, rejected, failed]
        errorCode:
          type: string
          nullable: true
        requestedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - groupId
      - accountId
      - status
      - requestedAt
    KickResponse:
      type: object
      properties:
        kicked:
          type: boolean
      required:
      - kicked
    PromoteRequest:
      type: object
      properties:
        byAccountId:
          type: string
        accountId:
          type: string
      required:
      - byAccountId
      - accountId
    SendRequest:
      type: object
      properties:
        accountId:
          type: string
        text:
          type: string
      required:
      - accountId
      - text
    SendAccepted:
      type: object
      properties:
        clientMsgId:
          type: string
      required:
      - clientMsgId
    Job:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              step:
                type: string
              code:
                type: string
            required: *id001
      required:
      - status
      - errors
    MessageMedia:
      type: object
      properties:
        fileName:
          type: string
          nullable: true
        contentType:
          type: string
          nullable: true
        size:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          nullable: true
        sourceUrl:
          type: string
          nullable: true
        localUrl:
          type: string
          nullable: true
    Message:
      type: object
      properties:
        id:
          type: string
        msgId:
          type: string
          nullable: true
        clientMsgId:
          type: string
          nullable: true
        senderPlatformUserId:
          type: string
          nullable: true
        isOwn:
          type: boolean
        text:
          type: string
        sentAt:
          type: string
          format: date-time
        deliveryStatus:
          type: string
          nullable: true
        failCode:
          type: string
          nullable: true
        localFilePath:
          type: string
          nullable: true
        media:
          allOf:
          - $ref: '#/components/schemas/MessageMedia'
          nullable: true
      required: *id001
    MessagePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        nextCursor:
          type: string
          nullable: true
      required:
      - items
    AgentStep:
      type: object
      properties:
        kind:
          type: string
        toolUseId:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        input:
          type: object
          nullable: true
        resultSummary:
          type: string
        isError:
          type: boolean
        errorCode:
          type: string
          nullable: true
        auditVerdict:
          type: string
          nullable: true
        rawResponse:
          type: string
      required: *id001
    AgentRun:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        status:
          type: string
        endReason:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/AgentStep'
        traceId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - status
    SequenceStepInput:
      type: object
      properties:
        index:
          type: integer
        accountRole:
          type: string
        senderAccountId:
          type: string
          description: Optional service account ID; when omitted the sender is selected by accountRole.
        text:
          type: string
        delaySeconds:
          type: number
      required:
      - index
      - accountRole
      - text
      - delaySeconds
    SequenceInput:
      type: object
      properties:
        name:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/SequenceStepInput'
      required:
      - name
      - steps
    SequenceId:
      type: object
      properties:
        id:
          type: string
      required:
      - id
    Sequence:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/SequenceStepInput'
      required:
      - id
      - name
      - steps
    StartSequence:
      type: object
      properties:
        sequenceId:
          type: string
        vars:
          type: object
          additionalProperties:
            type: string
        stepVars:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        stepAccountIds:
          type: object
          description: Optional sender override by one-based step index; an empty string restores automatic role selection.
          additionalProperties:
            type: string
      required:
      - sequenceId
    SequencePreviewInput:
      type: object
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/SequenceStepInput'
        vars:
          type: object
          additionalProperties:
            type: string
        stepVars:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        stepAccountIds:
          type: object
          additionalProperties:
            type: string
      required:
      - steps
    SequencePreview:
      type: object
      properties:
        steps:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              accountRole:
                type: string
              senderAccountId:
                type: string
              text:
                type: string
              delaySeconds:
                type: number
              resolvedVars:
                type: object
                additionalProperties:
                  type: string
              varSources:
                type: object
                additionalProperties:
                  type: string
      required:
      - steps
    SequenceRun:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        sequenceId:
          type: string
        status:
          type: string
          enum: [running, finished, failed, stopped]
        currentStepIndex:
          type: integer
        steps:
          type: array
          items:
            $ref: '#/components/schemas/SequenceRunStep'
        createdAt:
          type: string
          format: date-time
      required:
      - status
      - currentStepIndex
      - steps
    SequenceRunPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SequenceRun'
        nextCursor:
          type: string
          nullable: true
      required:
      - items
    ActiveSequenceRun:
      type: object
      properties:
        run:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/SequenceRun'
      required:
      - run
    SequenceRunStep:
      type: object
      properties:
        index:
          type: integer
        status:
          type: string
          enum: [pending, accepted, sent, skipped, failed]
        text:
          type: string
        accountRole:
          type: string
          enum: [admin, member]
        senderAccountId:
          type: string
          description: Requested sender account ID; absent means automatic role selection.
        accountId:
          type: string
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        sentAt:
          type: string
          format: date-time
          nullable: true
        clientMsgId:
          type: string
          nullable: true
        resolvedVars:
          type: object
          additionalProperties:
            type: string
        varSources:
          type: object
          additionalProperties:
            type: string
      required:
      - index
      - status
      - text
      - accountRole
      - scheduledAt
      - sentAt
      - clientMsgId
      - resolvedVars
      - varSources
    Health:
      type: object
      properties:
        ok:
          type: boolean
        schemaVersion:
          type: string
      required:
      - ok
      - schemaVersion
    TraceEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        traceId:
          type: string
        service:
          type: string
        eventType:
          type: string
        payload:
          type: object
        createdAt:
          type: string
          format: date-time
      required:
      - traceId
      - service
      - eventType
      - payload
    TraceResponse:
      type: object
      properties:
        traceId:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/TraceEvent'
        truncated:
          type: boolean
      required:
      - traceId
      - events
      - truncated
security:
- bearerAuth: []
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /api/traces/{traceId}:
    get:
      operationId: getTrace
      parameters:
      - name: traceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Trace event chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceResponse'
  /api/auth/login:
    post:
      operationId: login
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /api/auth/refresh:
    post:
      operationId: refresh
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
      security: []
  /api/auth/logout:
    post:
      operationId: logout
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: *id001
  /api/accounts:
    get:
      operationId: listAccounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                displayName:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
  /api/accounts/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
    patch:
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
    delete:
      operationId: deleteAccount
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
  /api/accounts/{id}/connect:
    post:
      operationId: connectAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  platformUserId:
                    type: string
                required: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/accounts/{id}/transition:
    post:
      operationId: transitionAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/groups:
    get:
      operationId: listGroups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
    post:
      operationId: createGroup
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
  /api/groups/{id}:
    get:
      operationId: getGroup
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: patchGroup
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupPatch'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/groups/{id}/members/invite:
    post:
      operationId: inviteGroupMember
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/groups/{id}/join-requests:
    get:
      operationId: listGroupJoinRequests
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Group join requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupJoinRequest'
    post:
      operationId: createGroupJoinRequest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJoinRequest'
      responses:
        '201':
          description: Submitted for operator approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupJoinRequest'
  /api/groups/{id}/join-requests/{requestId}/approve:
    post:
      operationId: approveGroupJoinRequest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Approved; gateway join starts asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupJoinRequest'
  /api/groups/{id}/join-requests/{requestId}/reject:
    post:
      operationId: rejectGroupJoinRequest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Rejected without contacting the gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupJoinRequest'
  /api/groups/{id}/members/join:
    post:
      operationId: joinGroupMember
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinAccepted'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/groups/{id}/members/promote:
    post:
      operationId: promoteGroupMember
      responses:
        '200':
          description: OK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/groups/{id}/members/kick:
    post:
      operationId: kickGroupMember
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KickResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                byAccountId:
                  type: string
                targetPlatformUserId:
                  type: string
              required:
              - byAccountId
              - targetPlatformUserId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/groups/{id}/members/leave:
    post:
      operationId: leaveGroupMember
      responses:
        '200':
          description: OK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
              required:
              - accountId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/groups/{id}/send:
    post:
      operationId: sendMessage
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAccepted'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/groups/{id}/leave-all:
    post:
      operationId: leaveAll
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobId'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/media/{id}:
    get:
      operationId: downloadMedia
      responses:
        '200':
          description: Downloaded media
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/groups/{id}/messages:
    get:
      operationId: listMessages
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: before
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
  /api/jobs/{id}:
    get:
      operationId: getJob
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/sequences:
    get:
      operationId: listSequences
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
