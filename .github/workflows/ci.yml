name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sentinel:sentinel@127.0.0.1:5432/sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix gateway-service ci
          npm --prefix agent-service ci
          npm --prefix frontend ci
      - name: Install PostgreSQL client and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          npx playwright install --with-deps chromium
      - name: Build and verify
        run: |
          npm run build
          npm --prefix backend test
          npm run integration
          npm run e2e
